name: Resource Manifest Sync
# PR 合并进 main 后自动生成 resource_manifest.json（实施计划 §11-§14）。
# 无 schedule、无周期任务；并发串行化，不丢合并事件。
#
# 提交路径（按顺序尝试，均为普通 push，禁止 force push）：
# 1. 直接 push main —— 适用于配置了 ruleset Integration bypass 的组织仓库；
# 2. 被分支保护拒绝时：用 main 检出上的可信 checker 本地校验生成结果，
#    以 `Resource Version Check` context 给 bot commit 挂 commit status 后重试 push。
#    classic branch protection 的 required status check 认可该 status，push 放行。
#    注意：不能用「bot 开 PR 等 RVC」——GITHUB_TOKEN 创建的 PR 不触发新 workflow
#    （GitHub 防递归硬限制），PR 永远等不到 check，死锁。
on:
  pull_request:
    types:
      - closed
permissions:
  contents: write
  statuses: write # 以 RVC context 给 bot commit 报校验结果
concurrency:
  # 串行处理合并事件：过期 run 会排队而非互相覆盖
  group: resource-manifest-sync-main
  cancel-in-progress: false
jobs:
  sync-manifest:
    # 只处理真正合并进 main 的 PR
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 快速判定（O(1)）：version 与 manifest.resource_version 相等则无事可做。
      # docs-only PR 在这里直接退出；同时兜住上一次 sync 失败后的追平场景。
      - name: Quick check version vs resource_version
        id: quick
        run: |
          VERSION="$(cat version)"
          RESOURCE_VERSION="$(python3 -c "import json;print(json.load(open('resource_manifest.json'))['resource_version'])")"
          echo "version=${VERSION} resource_version=${RESOURCE_VERSION}"
          if [ "${VERSION}" = "${RESOURCE_VERSION}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "manifest already in sync; nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate manifest
        if: steps.quick.outputs.skip == 'false'
        run: python3 scripts/generate_resource_manifest.py .

      # 提交前保护：工作区只允许出现 resource_manifest.json（计划 §13）
      - name: Guard only manifest may be modified
        id: guard
        if: steps.quick.outputs.skip == 'false'
        run: |
          DIRTY="$(git diff --name-only)"
          echo "workspace changes: ${DIRTY}"
          if [ -z "${DIRTY}" ]; then
            echo "no changes produced; manifest already up to date"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "${DIRTY}" = "resource_manifest.json" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::generator produced unexpected workspace changes; refusing to commit"
            exit 1
          fi

      - name: Commit
        id: commit
        if: steps.quick.outputs.skip == 'false' && steps.guard.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- resource_manifest.json
          git commit -m "chore: sync generated resource manifest"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 本地校验生成结果（main 检出上的可信 checker，等价于 RVC 对 bot PR 的放行语义），
      # 校验通过后以 RVC context 挂 status，绕过 classic protection 的 required status check。
      # 该 status 反映的是本 workflow 在 main 代码上对 bot commit 的真实校验结果，非伪造成功。
      - name: Verify generated commit and report status
        if: steps.commit.outputs.sha != ''
        run: |
          SHA="${{ steps.commit.outputs.sha }}"
          TMP_BRANCH="manifest-sync/$(date +%s)"
          # commit status 只能挂在远端已知的 commit 上：先 push 到临时分支（同 SHA），
          # 挂 status 后再 push main（同 SHA fast-forward，protection 看到 required check success 放行）
          git push origin HEAD:"$TMP_BRANCH"
          if python3 scripts/check_resource_version.py --allow-manifest-edit --base HEAD~1 --head "$SHA"; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          gh api repos/${{ github.repository }}/statuses/"$SHA" \
            -f state="$STATUS" \
            -f context="Resource Version Check" \
            -f description="verified by Resource Manifest Sync on main checkout"
          if [ "$STATUS" != "success" ]; then
            echo "::error::generated commit failed resource version verification"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Push
        if: steps.commit.outputs.sha != ''
        run: |
          # 只做普通 push，禁止 force push；若其他 PR 先进了 main，
          # non-fast-forward 失败即可——那个合并事件已排队下一次 sync，会自动追平
          git push origin HEAD:main