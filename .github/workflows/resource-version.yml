name: Resource Version
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  resource-version:
    name: Resource Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.head.sha }}
      - run: python3 scripts/check_resource_version.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}
