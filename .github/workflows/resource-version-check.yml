name: Resource Version Check
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: resource-version-check-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  resource-version-check:
    name: Resource Version Check
    runs-on: ubuntu-latest
    steps:
      # 工作区检出到 base：始终运行 main 上的校验脚本，避免执行 PR 控制的代码
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.head.sha }}
      # bot 的 manifest 同步 PR（head 分支名 manifest-sync/*）带标志放行；
      # 标志决定权在 main 检出上的本 workflow，PR 内容无法注入
      - if: ${{ !startsWith(github.event.pull_request.head.ref, 'manifest-sync/') }}
        run: >-
          python3 scripts/check_resource_version.py
          --version-file version
          --manifest-file resource_manifest.json
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
      - if: ${{ startsWith(github.event.pull_request.head.ref, 'manifest-sync/') }}
        run: >-
          python3 scripts/check_resource_version.py
          --version-file version
          --manifest-file resource_manifest.json
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --allow-manifest-edit
